# nginx only inherits add_header directives into a location that declares none
# of its own. Any location below that sets caching headers must therefore
# re-include this snippet, or it silently drops all of them.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options        DENY   always;
add_header Referrer-Policy        strict-origin-when-cross-origin always;
