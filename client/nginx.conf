# Production server block for the DevPulse SPA.
#
# There is deliberately no /api location here: in AWS the Application Load
# Balancer matches /api/* first and forwards it to the backend target group, so
# those requests never reach this container. Adding a proxy_pass to a backend
# hostname that does not resolve inside the ECS task would stop nginx booting.
# The Compose "full" profile mounts nginx.local.conf over this file, which adds
# the /api proxy that the ALB provides in production.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The API sets its own headers via helmet; these cover the static origin.
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Target-group health check. Cheaper than serving index.html, and it keeps
    # health traffic out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely; a new deploy produces new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a browser keeps loading the old
    # bundle references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
