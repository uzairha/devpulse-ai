# Docker Compose ("full" profile) server block.
#
# Identical to nginx.conf except for the /api location, which reproduces locally
# what the Application Load Balancer does in AWS: route /api/* to the backend so
# the SPA and the API share one origin. Mounted over the production config by
# docker-compose.yml; not used in any deployed image.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The API sets its own headers via helmet; these cover the static origin.
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Stands in for the ALB's /api/* listener rule.
    location /api/ {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
